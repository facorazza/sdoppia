name: Pipeline

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: false

env:
  CARGO_TERM_COLOR: always
  APP_NAME: dedup

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ gitea.repository }}-${{ gitea.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ gitea.repository }}-

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt

      - name: Run clippy
        run: cargo clippy --fix --allow-dirty --allow-staged
        # If building a library
        # run: cargo clippy --lib --fix --allow-dirty --allow-staged

      - name: Commit fixes
        run: |
          git config --local user.email "gitea-actions[bot]@facorazza.com"
          git config --local user.name "gitea-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-fix: cargo fmt and clippy"
          git push

      - name: Store cache
        id: store-cache
        if: success() || failure()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ gitea.repository }}-${{ gitea.ref_name }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ gitea.repository }}-${{ gitea.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ gitea.repository }}-

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Run tests
        run: cargo test --verbose
        # If building a library
        # run: cargo test --lib --verbose

      - name: Build library
        run: cargo build --release --verbose
        # If building a library
        # run: cargo build --lib --release --verbose

      # - name: Run doc tests
      #   run: cargo test --doc --verbose

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items
        # If building a library
        # run: cargo doc --lib --no-deps --document-private-items

      - name: Store cache
        id: store-cache
        if: success() || failure()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ gitea.repository }}-${{ gitea.ref_name }}

  publish-binary:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ gitea.repository }}-${{ gitea.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ gitea.repository }}-

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Extract version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            # Get base version from Cargo.toml and append -alpha.TIMESTAMP
            BASE_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            VERSION="${BASE_VERSION}-alpha.${TIMESTAMP}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            # Get base version from Cargo.toml and append -rc.TIMESTAMP
            BASE_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            VERSION="${BASE_VERSION}-rc.${TIMESTAMP}"
          else
            # For any other branch, create alpha with branch name
            BASE_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            VERSION="${BASE_VERSION}-alpha.${BRANCH_NAME}.${TIMESTAMP}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update Cargo.toml version
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          cat Cargo.toml | grep "^version"

      - name: Configure Cargo registry
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [registries.gitea]
          index = "sparse+https://git.facorazza.com/api/packages/facorazza/cargo/"
          credential-provider = ["cargo:token"]
          EOF

          cat > ~/.cargo/credentials.toml << EOF
          [registries.gitea]
          token = "Bearer ${{ secrets.RUNNER_TOKEN }}"
          EOF

      - name: Publish to Gitea registry
        run: |
          cargo publish --registry gitea --allow-dirty

      - name: Store cache
        id: store-cache
        if: success() || failure()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ gitea.repository }}-${{ gitea.ref_name }}

      - name: Create Gitea release
        uses: actions/create-release@v1
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          release_name: Rust Library ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Changes in ${{ steps.get_version.outputs.VERSION }}

            ### Installation

            Add to your `Cargo.toml`:
            ```toml
            [dependencies]
            ${APP_NAME} = { version = "${{ steps.get_version.outputs.VERSION }}", registry = "gitea" }
            ```

            ### Usage

            See [README.md](https://git.facorazza.com/facorazza/${APP_NAME}) for usage instructions.
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'rc') }}

  build-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ gitea.repository }}-${{ gitea.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ gitea.repository }}-

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Configure Cargo registry
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [registries.gitea]
          index = "sparse+https://git.facorazza.com/api/packages/facorazza/cargo/"
          credential-provider = ["cargo:token"]
          EOF

          cat > ~/.cargo/credentials.toml << EOF
          [registries.gitea]
          token = "Bearer ${{ secrets.RUNNER_TOKEN }}"
          EOF

      - name: Build binary
        run: |
          if [[ ${{ gitea.ref }} == refs/tags/* || ${{ gitea.ref_name }} == main ]]; then
            cargo build --release --bin ${APP_NAME}
            cp target/release/${APP_NAME} .
          else
            cargo build --bin ${APP_NAME}
            cp target/debug/${APP_NAME} .
          fi

      - name: Store cache
        id: store-cache
        if: success() || failure()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ gitea.repository }}-${{ gitea.ref_name }}
