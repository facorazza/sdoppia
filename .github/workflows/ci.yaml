name: Pipeline

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: sdoppia

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.repository }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Store cache
        id: store-cache
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ github.ref_name }}

  test:
    # The tool documents behaviour that only exists off Unix — identity is
    # unknown there, so every path counts as its own copy — and `file_identity`
    # has a `#[cfg(not(unix))]` arm that nothing else would ever compile.
    # fail-fast is off so one platform failing still reports the others.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.repository }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --verbose

      - name: Store cache
        id: store-cache
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ github.ref_name }}

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.repository }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --verbose

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items

      - name: Store cache
        id: store-cache
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ github.ref_name }}

  publish-crates-io:
    runs-on: ubuntu-latest
    # Publishing is irreversible and a version can never be replaced, only
    # yanked, so it waits on the whole matrix and on the release build rather
    # than running alongside them.
    needs: [test, package]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  release:
    runs-on: ubuntu-latest
    needs: [test, package]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ github.repository }}-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Build release binary
        run: cargo build --release

      - name: Store cache
        id: store-cache
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ github.repository }}-${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: sdoppia ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Changes in ${{ steps.get_version.outputs.VERSION }}

            ### Binary

            Download the prebuilt `sdoppia` binary attached to this release.

            ### Install from crates.io

            ```sh
            cargo install sdoppia
            ```

            ### Usage

            See [README.md](https://github.com/facorazza/sdoppia) for usage instructions.
          files: target/release/sdoppia
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'rc') }}