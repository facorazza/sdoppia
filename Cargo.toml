[package]
name = "sdoppia"
version = "0.6.1"
edition = "2024"
description = "A CLI tool to scan directories, hash files, and find duplicate files"
license = "MIT"
repository = "https://github.com/facorazza/sdoppia"
keywords = ["duplicate", "deduplication", "hash", "files", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
crossbeam-channel = "0.5.13"
dirs = "6.0.0"
indicatif = "0.18.3"
rayon = "1.11.0"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"
