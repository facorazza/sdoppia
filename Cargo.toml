[package]
name = "sdoppia"
version = "0.8.0"
edition = "2024"
description = "A CLI tool to scan directories, hash files, and find duplicate files"
license = "MIT"
repository = "https://github.com/facorazza/sdoppia"
keywords = ["duplicate", "deduplication", "hash", "files", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "7.0.0"
indicatif = "0.18"
rayon = "1.12"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
