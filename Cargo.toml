[package]
name = "sdoppia"
version = "0.9.1"
edition = "2024"
# Edition 2024 is the floor, not a preference: it is what determines the
# minimum compiler, so stating it separately only makes the requirement visible.
rust-version = "1.85"
description = "A CLI tool to scan directories, hash files, and find duplicate files"
license = "MIT"
repository = "https://github.com/facorazza/sdoppia"
keywords = ["duplicate", "deduplication", "hash", "files", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "7"
indicatif = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
# `CreateFileW` sits behind Win32_Security because it takes a SECURITY_ATTRIBUTES
# pointer, which is passed as null here.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
